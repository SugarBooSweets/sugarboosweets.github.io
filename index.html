 }

 }
 if(tab=="t")h+=teamHtml();

 if(tab=="t")teamBind();

 if(!id){toast("مش لاقي السجل، حدّث الصفحة");return}

 if(id===undefined&&false){}

function teamHtml(){
 var h='<div class="card"><div class="b" style="direction:ltr;text-align:right">'+esc(myName)+'</div><div class="m">صلاحيتك: <span class="tag">'+esc(role)+'</span></div><div class="acts"><button id="lo">تسجيل خروج</button></div></div>';
 h+='<div class="card"><div class="m" style="line-height:1.9">👁 <b>مشاهد:</b> يشوف بس<br>✍️ <b>محرّر:</b> يضيف ويعدّل<br>👑 <b>مدير:</b> كل حاجة + الحذف + التصدير + إدارة الفريق</div></div>';
 if(myRole=="admin"){
  h+='<div class="card"><div class="b">الفريق</div>'+members.map(function(m,i){return'<div class="row" style="margin-top:8px"><span class="m" style="direction:ltr">'+esc(m.email)+'</span><span style="display:flex;gap:4px"><select data-mr="'+i+'" style="width:auto;padding:6px">'+["viewer","editor","admin"].map(function(r){return'<option value="'+r+'" '+(m.role==r?"selected":"")+'>'+ROLEAR[r]+'</option>'}).join("")+'</select>'+(m.email==myName?'':'<button data-md="'+i+'" class="btn s" style="padding:6px 10px">✕</button>')+'</span></div>'}).join("")
  +'<div class="b" style="margin-top:14px">إضافة عضو</div><div style="display:grid;gap:8px;margin-top:6px"><input id="me" type="email" placeholder="الإيميل" style="direction:ltr" autocomplete="off"><select id="mrl"><option value="viewer">مشاهد</option><option value="editor" selected>محرّر</option><option value="admin">مدير</option></select><button class="btn" id="ma">إضافة</button></div><div class="m" style="margin-top:6px">بعد الإضافة هنا: اعمل له حساب من Supabase ← Authentication ← Users ← Add user (بنفس الإيميل وباسورد).</div></div>';
 }
 return h}
function teamBind(){
 $("#lo").onclick=function(){sb.auth.signOut()};
 document.querySelectorAll("[data-mr]").forEach(function(x){x.onchange=function(){var m=members[+x.dataset.mr];sb.from("members").update({role:x.value}).eq("email",m.email).then(function(r){toast(r.error?"مقدرش يعدّل":"اتعدّل");loadMembers()})}});
 document.querySelectorAll("[data-md]").forEach(function(x){x.onclick=function(){var m=members[+x.dataset.md];ask("تشيل "+esc(m.email)+" من الفريق؟",function(){sb.from("members").delete().eq("email",m.email).then(function(r){toast(r.error?"مقدرش يحذف":"اتشال");loadMembers()})})}});
 var ma=$("#ma");if(ma)ma.onclick=function(){var e=$("#me").value.trim().toLowerCase();if(!e){toast("اكتب الإيميل");return}
  sb.from("members").insert({email:e,role:$("#mrl").value}).then(function(r){toast(r.error?"مقدرش يضيف":"اتضاف");loadMembers()})}
}

async function exportCsv(k){
 var rows,name;
 if(k=="o"){rows=[["رقم الأوردر","الزبون","التليفون","العنوان","الطلب","تاريخ التسليم","الساعة","الإجمالي","المدفوع","الباقي","الحالة","ملاحظات"]];
  orders.slice().sort(function(a,b){return n(a.no)-n(b.no)}).forEach(function(o){rows.push(["SB-"+String(o.no||0).padStart(3,"0"),o.customer,"'"+(o.phone||""),o.address,o.items,o.date,o.time,n(o.total),n(o.paid),n(o.total)-n(o.paid),o.status,o.notes])});name="sugarboo-orders-"}
 else{rows=[["التاريخ","الصنف","الكمية","السعر","النوع","المورّد"]];
  buys.slice().sort(function(a,b){return(a.date||"").localeCompare(b.date||"")}).forEach(function(x){rows.push([x.date,x.item,x.qty,n(x.price),x.cat,x.supplier])});name="sugarboo-purchases-"}
 var data="\uFEFF"+csv(rows);
 if(typeof claude==="undefined"){var a=document.createElement("a");a.href=URL.createObjectURL(new Blob([data],{type:"text/csv;charset=utf-8"}));a.download=name+today()+".csv";document.body.appendChild(a);a.click();a.remove();return}
 try{var d=await claude.use("downloads");if(!d){toast("التصدير مش متاح هنا");return}
  await d.save({filename:name+today()+".csv",data:data})}catch(e){if(!e||e.code!="declined")toast("مقدرش ينزّل الملف")}
}
</script></body></html>
